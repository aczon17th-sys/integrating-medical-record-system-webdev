<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments | Medical System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="dashboard.html">Medical System</a>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="patients.html">Patients</a>
      <a href="appointments.html">Appointments</a>
      <a href="records.html">Records</a>
      <a href="billing.html">Billing</a>
      <a href="accounts.html" class="admin-only">Accounts</a>
      <button id="logoutBtn" type="button">Logout</button>
    </nav>
  </header>

  <main class="page">
    <section class="page-heading">
      <div>
        <p class="eyebrow">Schedule</p>
        <h1>Appointment Scheduling</h1>
      </div>
    </section>

    <section class="panel">
      <h2 id="appointmentFormTitle">Create Appointment</h2>
      <form id="appointmentForm" class="form-grid">
        <input type="hidden" id="appointmentId">
        <label>Patient Name<input id="patientName" required></label>
        <label>Date<input id="appointmentDate" type="date" required></label>
        <label>Time<input id="appointmentTime" type="time" required></label>
        <label>Status
          <select id="status">
            <option value="requested">Requested</option>
            <option value="scheduled">Scheduled</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
            <option value="rejected">Rejected</option>
          </select>
        </label>
        <label class="span-2">Reason<textarea id="reason"></textarea></label>
        <div class="actions span-2">
          <button class="button" type="submit">Save Appointment</button>
          <button class="secondary-button" type="button" id="resetAppointmentForm">Clear</button>
        </div>
      </form>
      <p id="appointmentMessage" class="message"></p>
    </section>

    <section class="panel">
      <h2>Appointment List</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Patient</th>
              <th>Date</th>
              <th>Time</th>
              <th>Reason</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="appointmentTable"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
