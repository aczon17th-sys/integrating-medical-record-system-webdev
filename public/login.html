<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Medical System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-info">
      <p class="eyebrow">Clinic platform</p>
      <h1>Integrating Medical Record and Appointment Scheduling System</h1>
      <p>Manage patient records, appointments, findings, prescriptions, and billings with role-based access.</p>
    </section>

    <section class="panel login-panel">
      <h2>System Login</h2>
      <p class="muted">Use an admin, doctor, or staff email account.</p>
      <form id="loginForm">
        <label>
          Email
          <input type="email" id="email" autocomplete="email" required>
        </label>
        <label>
          Password
          <input type="password" id="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="button">Login</button>
        <p id="loginMessage" class="message"></p>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
