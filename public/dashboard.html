<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Medical System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="dashboard.html">Medical System</a>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="patients.html">Patients</a>
      <a href="appointments.html">Appointments</a>
      <a href="records.html">Records</a>
      <a href="billing.html">Billing</a>
      <a href="accounts.html" class="admin-only">Accounts</a>
      <button id="logoutBtn" type="button">Logout</button>
    </nav>
  </header>

  <main class="page">
    <section class="page-heading">
      <div>
        <p class="eyebrow">Overview</p>
        <h1>Dashboard</h1>
      </div>
      <p id="currentUser" class="muted"></p>
    </section>

    <section class="stats-grid">
      <article class="stat">
        <small>Total Patients</small>
        <strong id="totalPatients">0</strong>
      </article>
      <article class="stat">
        <small>Total Appointments</small>
        <strong id="totalAppointments">0</strong>
      </article>
      <article class="stat">
        <small>Average Patient Age</small>
        <strong id="averageAge">0</strong>
      </article>
    </section>

    <section class="panel">
      <h2>Patient Population</h2>
      <div class="chart-grid">
        <canvas id="patientChart" width="720" height="280" aria-label="Patient registration chart"></canvas>
        <div id="populationSummary" class="activity-list"></div>
      </div>
    </section>

    <section class="panel">
      <h2>Recent Activities</h2>
      <div id="recentActivities" class="activity-list"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
